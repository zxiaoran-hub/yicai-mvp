<style>
:root {
  --orange: #F37021;
  --brown: #3C2415;
  --beige: #FAF6F0;
  --gold: #C8A96E;
  --white: #FFFFFF;
  --gray: #999;
  --light-gray: #E8E4DF;
  --shadow: 0 2px 12px rgba(60,36,21,0.08);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; background: var(--beige); color: var(--brown); min-height: 100vh; }
.container { max-width: 480px; margin: 0 auto; padding: 20px 16px; min-height: 100vh; display: flex; flex-direction: column; }
.logo-section { text-align: center; padding: 40px 0 20px; }
.logo { width: 72px; height: 72px; background: linear-gradient(135deg, var(--orange), var(--gold)); border-radius: 18px; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 16px; box-shadow: 0 4px 20px rgba(243,112,33,0.3); }
.logo-text { font-size: 32px; font-weight: 800; color: var(--white); letter-spacing: -1px; }
h1 { font-size: 28px; font-weight: 700; color: var(--brown); margin-bottom: 8px; }
.subtitle { font-size: 15px; color: var(--gray); letter-spacing: 2px; }
.cards { flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 30px 0; }
.card { background: var(--white); border-radius: 16px; padding: 24px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 16px; text-decoration: none; color: var(--brown); transition: transform 0.2s, box-shadow 0.2s; cursor: pointer; }
.card:active { transform: scale(0.98); box-shadow: 0 1px 6px rgba(60,36,21,0.1); }
.card-icon { width: 52px; height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
.card-icon.supplier { background: linear-gradient(135deg, #FFF3EB, #FFE8D6); }
.card-icon.buyer { background: linear-gradient(135deg, #EBF5FF, #D6ECFF); }
.card-icon.company { background: linear-gradient(135deg, #F0EBFF, #E0D6FF); }
.card-info { flex: 1; }
.card-title { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
.card-desc { font-size: 13px; color: var(--gray); }
.card-arrow { font-size: 18px; color: var(--light-gray); }
.footer { text-align: center; padding: 20px 0; }
.footer-text { font-size: 12px; color: var(--light-gray); }
.badge { display: inline-block; background: var(--orange); color: var(--white); font-size: 11px; padding: 2px 8px; border-radius: 10px; margin-top: 6px; }
@media(min-width:768px) {
  .container { max-width: 600px; padding: 40px 24px; }
  .cards { flex-direction: row; flex-wrap: wrap; justify-content: center; }
  .card { width: calc(50% - 8px); flex-direction: column; text-align: center; padding: 32px 20px; }
  .card:last-child { width: calc(50% - 8px); }
}
</style>
</head>

      </div>
      <span class="card-arrow">›</span>
    </a>
  </div>
  <div class="footer">
