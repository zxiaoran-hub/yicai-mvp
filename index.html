.card-title { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
.card-desc { font-size: 13px; color: var(--gray); }
.card-arrow { font-size: 18px; color: var(--light-gray); }
.footer { text-align: center; padding: 20px 0; }
.footer-text { font-size: 12px; color: var(--light-gray); }
.badge { display: inline-block; background: var(--orange); color: var(--white); font-size: 11px; padding: 2px 8px; border-radius: 10px; margin-top: 6px; }
