<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>异采</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
  background: #FAF6F0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.brand { text-align: center; margin-bottom: 48px; }
.brand h1 { font-family: 'Noto Serif SC', serif; font-size: 36px; color: #3C2415; letter-spacing: 8px; margin-bottom: 8px; }
.brand p { font-size: 13px; color: #7A6E65; letter-spacing: 2px; }
.cards { display: flex; flex-direction: column; gap: 16px; width: 100%; max-width: 360px; }
.card {
  background: white; border-radius: 16px; padding: 28px 24px; text-decoration: none; color: #2D2926;
  box-shadow: 0 2px 12px rgba(60,36,21,0.08); display: flex; align-items: center; gap: 20px;
}
.card:active { transform: scale(0.97); }
.card-icon { width: 56px; height: 56px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 26px; flex-shrink: 0; }
.card-icon.buyer { background: #F37021; }
.card-icon.supplier { background: #3C2415; }
.card-text h3 { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
.card-text p { font-size: 12px; color: #7A6E65; }
.footer { margin-top: 48px; font-size: 11px; color: #C4B8AC; letter-spacing: 1px; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="brand"><h1>异 采</h1><p>化妆品行业可信供应链平台</p></div>
<div class="cards">
  <a class="card" href="buyer.html">
    <div class="card-icon buyer">🛍️</div>
    <div class="card-text"><h3>采购方入口</h3><p>搜索供应商 · 查看生产过程 · 追踪订单 · 发送询盘</p></div>
  </a>
  <a class="card" href="supplier.html">
    <div class="card-icon supplier">🏭</div>
    <div class="card-text"><h3>供应商入口</h3><p>管理工作台 · 上传生产记录 · 管理产品</p></div>
  </a>
</div>
<div class="footer">YICAI · COSMETICS SUPPLY CHAIN PLATFORM</div>
</body>
</html>
