<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>异采 - 化妆品行业可信供应链平台</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--orange:#F37021;--brown:#3C2415;--bg:#FAF6F0;--text:#2D2926;--sub:#7A6E65;
--border:#E8DDD3;--tag-bg:#F5EDE4;--white:#FFFFFF;
}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
background:var(--bg);color:var(--text);max-width:430px;margin:0 auto;position:relative}

/* ===== Pages ===== */
.page{display:none;height:100vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:68px}
.page.active{display:flex;flex-direction:column}
.tab-content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}

/* ===== Top Brand ===== */
.brand-header{padding:16px 20px 8px;text-align:center}
.brand-name{font-family:'Noto Serif SC',serif;font-size:28px;font-weight:700;color:var(--brown);letter-spacing:4px}
.brand-sub{font-size:12px;color:var(--sub);margin-top:4px;letter-spacing:1px}

/* ===== Data Overview ===== */
.data-overview{display:flex;justify-content:center;gap:24px;padding:12px 20px;text-align:center}
.data-item .num{font-size:20px;font-weight:700;color:var(--orange)}
.data-item .label{font-size:11px;color:var(--sub);margin-top:2px}

/* ===== Search ===== */
.search-bar{margin:8px 20px;background:var(--white);border-radius:24px;display:flex;align-items:center;padding:10px 16px;gap:8px;border:1px solid var(--border)}
.search-bar svg{flex-shrink:0;color:var(--sub)}
.search-bar input{border:none;outline:none;flex:1;font-size:14px;background:transparent;color:var(--text)}
.search-bar input::placeholder{color:#B8ADA5}

/* ===== Banner ===== */
.banner{margin:12px 20px;border-radius:14px;padding:22px 20px;background:linear-gradient(135deg,#3C2415,#8B5E3C);color:#fff;text-align:center;position:relative;overflow:hidden}
.banner::before{content:'';position:absolute;top:-30px;right:-30px;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.06)}
.banner-text{font-size:15px;font-weight:600;letter-spacing:1px;line-height:1.6}

/* ===== Category Tabs ===== */
.cat-tabs{display:flex;gap:8px;padding:14px 20px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.cat-tabs::-webkit-scrollbar{display:none}
.cat-tab{flex-shrink:0;padding:6px 16px;border-radius:20px;font-size:13px;background:var(--tag-bg);color:var(--sub);border:none;cursor:pointer;transition:.2s}
.cat-tab.active{background:var(--orange);color:#fff}

/* ===== Supplier Cards ===== */
.supplier-list{padding:0 20px 20px}
.supplier-card{background:var(--white);border-radius:14px;padding:16px;margin-bottom:12px;border:1px solid var(--border);cursor:pointer;transition:transform .15s,box-shadow .15s}
.supplier-card:active{transform:scale(.98);box-shadow:0 2px 12px rgba(60,36,21,.08)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.card-name{font-size:15px;font-weight:600;color:var(--text);flex:1;margin-right:10px;line-height:1.4}
.score-badge{background:var(--orange);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:10px;flex-shrink:0;white-space:nowrap}
.card-meta{display:flex;gap:12px;font-size:12px;color:var(--sub);margin-bottom:8px;flex-wrap:wrap}
.card-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tag{font-size:11px;padding:3px 8px;border-radius:6px}
.tag-verify{background:var(--tag-bg);color:var(--brown)}
.tag-trace{background:#E8F5E9;color:#2E7D32;font-weight:600}
.card-live{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text);padding:8px 10px;background:#FFF8F0;border-radius:8px;border:1px solid #FDEBD0}
.pulse-dot{width:8px;height:8px;border-radius:50%;background:#4CAF50;display:inline-block;position:relative;flex-shrink:0}
.pulse-dot::after{content:'';position:absolute;inset:-3px;border-radius:50%;background:rgba(76,175,80,.3);animation:pulse 1.5s infinite}
.pulse-dot.orange{background:var(--orange)}
.pulse-dot.orange::after{background:rgba(243,112,33,.3)}
@keyframes pulse{0%{transform:scale(1);opacity:1}100%{transform:scale(2);opacity:0}}

/* ===== Detail Page ===== */
#detailPage{position:fixed;top:0;left:0;right:0;bottom:0;max-width:430px;margin:0 auto;z-index:100;background:var(--bg);transform:translateX(100%);transition:transform .3s ease}
#detailPage.show{transform:translateX(0)}
.detail-header{background:linear-gradient(135deg,#3C2415,#5C3D2E);padding:16px 20px;padding-top:max(16px,env(safe-area-inset-top));color:#fff;position:relative}
.detail-back{background:none;border:none;color:#fff;font-size:20px;cursor:pointer;padding:4px 8px 4px 0;position:absolute;left:12px;top:max(12px,env(safe-area-inset-top))}
.detail-title{text-align:center;padding-top:4px}
.detail-title h2{font-family:'Noto Serif SC',serif;font-size:20px;font-weight:600;letter-spacing:1px}
.detail-title .type-tag{display:inline-block;background:rgba(255,255,255,.15);font-size:11px;padding:3px 10px;border-radius:10px;margin-top:6px}
.detail-body{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;padding-bottom:80px}

/* Info Grid */
.info-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--border);margin:16px 20px;border-radius:12px;overflow:hidden}
.info-cell{background:var(--white);padding:14px 10px;text-align:center}
.info-cell .val{font-size:15px;font-weight:700;color:var(--text);margin-bottom:2px}
.info-cell .key{font-size:11px;color:var(--sub)}

/* Certs */
.section-title{font-size:16px;font-weight:600;padding:20px 20px 12px;color:var(--text);display:flex;align-items:center;gap:6px}
.certs-scroll{display:flex;gap:10px;padding:0 20px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.certs-scroll::-webkit-scrollbar{display:none}
.cert-card{flex-shrink:0;width:120px;background:var(--white);border:1px solid var(--border);border-radius:10px;padding:14px 10px;text-align:center}
.cert-icon{font-size:28px;margin-bottom:6px}
.cert-name{font-size:12px;color:var(--text);font-weight:500;margin-bottom:4px}
.cert-status{font-size:11px;color:#2E7D32;font-weight:600}

/* Factory */
.factory-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 20px}
.factory-item{background:var(--white);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.factory-img{height:80px;background:var(--tag-bg);display:flex;align-items:center;justify-content:center;font-size:32px}
.factory-label{text-align:center;font-size:12px;color:var(--sub);padding:8px}

/* Process Timeline */
.process-section{margin:0 20px;background:var(--white);border-radius:14px;padding:16px;border:1px solid var(--border)}
.process-desc{font-size:12px;color:var(--sub);margin-bottom:14px;line-height:1.6;padding:8px 10px;background:#FFF8F0;border-radius:8px}
.timeline{position:relative;padding-left:20px}
.timeline::before{content:'';position:absolute;left:5px;top:8px;bottom:8px;width:2px;background:var(--border)}
.tl-item{position:relative;padding-bottom:18px;padding-left:16px}
.tl-item:last-child{padding-bottom:0}
.tl-dot{position:absolute;left:-19px;top:4px;width:12px;height:12px;border-radius:50%;border:2px solid var(--border);background:var(--white);z-index:1}
.tl-dot.done{background:#4CAF50;border-color:#4CAF50}
.tl-dot.doing{background:var(--orange);border-color:var(--orange);animation:dotPulse 1.5s infinite}
@keyframes dotPulse{0%{box-shadow:0 0 0 0 rgba(243,112,33,.4)}70%{box-shadow:0 0 0 8px rgba(243,112,33,0)}100%{box-shadow:0 0 0 0 rgba(243,112,33,0)}}
.tl-dot.wait{background:var(--white);border-color:#CCC}
.tl-name{font-size:14px;font-weight:600;color:var(--text)}
.tl-time{font-size:11px;color:var(--sub);margin-top:2px}
.tl-desc{font-size:12px;color:var(--sub);margin-top:4px;line-height:1.5}
.tl-photo{margin-top:6px;display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--orange);background:#FFF3E8;padding:4px 10px;border-radius:6px}

/* Products */
.product-card{display:flex;gap:12px;background:var(--white);border:1px solid var(--border);border-radius:12px;padding:12px;margin:0 20px 10px}
.product-img{width:72px;height:72px;background:var(--tag-bg);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0}
.product-info{flex:1;display:flex;flex-direction:column;justify-content:center}
.product-name{font-size:14px;font-weight:600;margin-bottom:4px}
.product-spec{font-size:12px;color:var(--sub)}
.product-price{font-size:14px;font-weight:700;color:var(--orange);margin-top:4px}
.product-moq{font-size:11px;color:var(--sub)}

/* Bottom CTA */
.detail-cta{position:absolute;bottom:0;left:0;right:0;padding:12px 20px;padding-bottom:max(12px,env(safe-area-inset-bottom));background:var(--white);border-top:1px solid var(--border)}
.cta-btn{width:100%;padding:14px;background:var(--orange);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;transition:opacity .2s}
.cta-btn:active{opacity:.85}

/* ===== Inquiry Modal ===== */
.modal-overlay{position:fixed;inset:0;max-width:430px;margin:0 auto;background:rgba(0,0,0,.45);z-index:200;opacity:0;pointer-events:none;transition:opacity .3s}
.modal-overlay.show{opacity:1;pointer-events:auto}
.modal-sheet{position:absolute;bottom:0;left:0;right:0;background:var(--white);border-radius:20px 20px 0 0;padding:24px 20px;padding-bottom:max(24px,env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .35s ease;max-height:85vh;overflow-y:auto}
.modal-overlay.show .modal-sheet{transform:translateY(0)}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px}
.modal-title{font-size:18px;font-weight:600;text-align:center;margin-bottom:4px}
.modal-sub{font-size:13px;color:var(--sub);text-align:center;margin-bottom:20px}
.form-group{margin-bottom:16px}
.form-label{font-size:13px;font-weight:500;color:var(--text);margin-bottom:6px;display:block}
.form-label .opt{color:var(--sub);font-weight:400}
.form-input,.form-select,.form-textarea{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;font-size:14px;color:var(--text);background:var(--bg);outline:none;transition:border .2s;font-family:inherit}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--orange)}
.form-textarea{min-height:80px;resize:vertical}
.form-select{appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1.5L6 6.5L11 1.5' stroke='%237A6E65' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 14px center}
.modal-btns{display:flex;gap:10px;margin-top:20px}
.btn-cancel{flex:1;padding:13px;border:1px solid var(--border);border-radius:12px;background:var(--white);font-size:15px;color:var(--sub);cursor:pointer}
.btn-submit{flex:1;padding:13px;border:none;border-radius:12px;background:var(--orange);color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .2s}
.btn-submit:active{opacity:.85}

/* ===== Toast ===== */
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.8);background:rgba(45,41,38,.9);color:#fff;padding:14px 24px;border-radius:12px;font-size:14px;z-index:999;opacity:0;transition:all .3s;pointer-events:none;text-align:center;max-width:300px}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* ===== Favorites ===== */
.fav-empty{text-align:center;padding:80px 40px;color:var(--sub)}
.fav-empty .icon{font-size:48px;margin-bottom:12px}
.fav-empty p{font-size:14px;line-height:1.6}
.fav-card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:14px;margin:0 20px 10px;display:flex;align-items:center;gap:12px;cursor:pointer}
.fav-avatar{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,#3C2415,#8B5E3C);display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;font-family:'Noto Serif SC',serif;font-weight:700;flex-shrink:0}
.fav-info{flex:1}
.fav-name{font-size:14px;font-weight:600}
.fav-type{font-size:12px;color:var(--sub);margin-top:2px}
.fav-score{font-size:12px;font-weight:700;color:var(--orange)}

/* ===== Inquiries ===== */
.inquiry-card{background:var(--white);border:1px solid var(--border);border-radius:12px;margin:0 20px 10px;overflow:hidden;cursor:pointer;transition:all .2s}
.inquiry-top{padding:14px;display:flex;justify-content:space-between;align-items:flex-start}
.inquiry-supplier{font-size:14px;font-weight:600;flex:1}
.inquiry-status{font-size:11px;padding:3px 10px;border-radius:10px;font-weight:600;flex-shrink:0}
.status-pending{background:#FFF3E0;color:#E65100}
.status-replied{background:#E8F5E9;color:#2E7D32}
.status-closed{background:var(--tag-bg);color:var(--sub)}
.inquiry-meta{padding:0 14px 12px;font-size:12px;color:var(--sub);display:flex;gap:16px}
.inquiry-detail{max-height:0;overflow:hidden;transition:max-height .3s ease}
.inquiry-detail.open{max-height:500px}
.inquiry-detail-inner{padding:0 14px 14px;border-top:1px solid var(--border);padding-top:12px}
.inquiry-row{display:flex;margin-bottom:8px;font-size:13px}
.inquiry-row .k{color:var(--sub);width:70px;flex-shrink:0}
.inquiry-row .v{color:var(--text);flex:1}
.inquiry-reply{margin-top:10px;padding:10px;background:#F1F8E9;border-radius:8px;font-size:12px;color:#33691E;line-height:1.6}

/* ===== Profile ===== */
.profile-header{background:linear-gradient(135deg,#3C2415,#5C3D2E);padding:30px 20px;text-align:center;color:#fff}
.profile-avatar{width:64px;height:64px;border-radius:50%;background:var(--orange);display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 10px}
.profile-name{font-size:18px;font-weight:600}
.profile-role{font-size:12px;opacity:.7;margin-top:4px}
.profile-menu{margin:16px 20px}
.menu-item{display:flex;align-items:center;padding:16px;background:var(--white);border:1px solid var(--border);border-radius:12px;margin-bottom:8px;cursor:pointer;transition:background .15s}
.menu-item:active{background:var(--tag-bg)}
.menu-icon{font-size:20px;margin-right:12px}
.menu-text{flex:1;font-size:15px;color:var(--text)}
.menu-arrow{color:var(--sub);font-size:14px}

/* ===== Bottom Tab ===== */
.tab-bar{position:fixed;bottom:0;left:0;right:0;max-width:430px;margin:0 auto;background:var(--white);border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:50}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 0 6px;cursor:pointer;transition:color .2s;color:var(--sub)}
.tab-item.active{color:var(--orange)}
.tab-item svg{width:22px;height:22px;margin-bottom:2px}
.tab-item span{font-size:10px}
.tab-item.active svg{stroke:var(--orange)}

/* ===== Scrollbar ===== */
::-webkit-scrollbar{width:0;height:0}

/* ===== Section Divider ===== */
.section-divider{height:8px;background:var(--bg)}

/* ===== Orders ===== */
.order-card{background:var(--white);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(60,36,21,.06);cursor:pointer;transition:transform .2s}
.order-card:active{transform:scale(.98)}
.order-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.order-no{font-size:13px;font-weight:600;color:var(--brown)}
.order-status{font-size:11px;padding:3px 10px;border-radius:10px;font-weight:500}
.order-status.producing{background:#FFF0E6;color:var(--orange)}
.order-status.qc{background:#E8F5E9;color:#2E7D32}
.order-status.shipped{background:#E3F2FD;color:#1565C0}
.order-supplier{font-size:14px;font-weight:600;margin-bottom:4px}
.order-product{font-size:12px;color:var(--sub);margin-bottom:12px}
.order-progress{display:flex;align-items:center;gap:4px;margin-bottom:8px}
.order-progress-bar{flex:1;height:6px;background:var(--tag-bg);border-radius:3px;overflow:hidden}
.order-progress-fill{height:100%;border-radius:3px;background:var(--orange);transition:width .3s}
.order-progress-text{font-size:11px;color:var(--sub);min-width:36px;text-align:right}
.order-steps{display:flex;justify-content:space-between;margin-top:8px}
.order-step{display:flex;flex-direction:column;align-items:center;gap:4px}
.order-step .step-dot{width:10px;height:10px;border-radius:50%;background:var(--tag-bg)}
.order-step .step-dot.done{background:var(--orange)}
.order-step .step-dot.active{background:var(--orange);box-shadow:0 0 0 3px rgba(243,112,33,.3);animation:pulse2 2s infinite}
@keyframes pulse2{0%,100%{box-shadow:0 0 0 3px rgba(243,112,33,.3)}50%{box-shadow:0 0 0 6px rgba(243,112,33,.1)}}
.order-step .step-label{font-size:9px;color:var(--sub)}
.order-step .step-label.active{color:var(--orange);font-weight:600}

/* ===== Order Detail (overlay) ===== */
.order-detail-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:200;transform:translateX(100%);transition:transform .3s;overflow-y:auto;max-width:430px;margin:0 auto}
.order-detail-overlay.show{transform:translateX(0)}
.order-detail-header{background:linear-gradient(135deg,#3C2415,#5C3D2E);color:#fff;padding:40px 20px 20px}
.order-detail-back{background:none;border:none;color:#fff;font-size:14px;cursor:pointer;margin-bottom:8px;display:block;text-align:left}
.order-detail-title{font-size:18px;font-weight:600;font-family:'Noto Serif SC',serif}
.order-detail-sub{font-size:12px;opacity:.8;margin-top:4px}
.order-timeline{padding:20px;position:relative;padding-left:32px}
.order-timeline::before{content:'';position:absolute;left:22px;top:20px;bottom:20px;width:2px;background:var(--border)}
.ot-item{position:relative;margin-bottom:24px}
.ot-dot{position:absolute;left:-18px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--tag-bg);border:2px solid var(--border)}
.ot-dot.done{background:var(--orange);border-color:var(--orange)}
.ot-dot.active{background:var(--orange);border-color:var(--orange);box-shadow:0 0 0 4px rgba(243,112,33,.25);animation:pulse2 2s infinite}
.ot-name{font-size:14px;font-weight:600}
.ot-time{font-size:11px;color:var(--sub);margin-top:2px}
.ot-desc{font-size:12px;color:var(--sub);margin-top:4px;line-height:1.5}
.ot-photos{display:flex;gap:6px;margin-top:8px}
.ot-photo{width:52px;height:52px;border-radius:6px;background:var(--tag-bg);display:flex;align-items:center;justify-content:center;font-size:18px}
</style>
</head>
<body>

<!-- ========== Page 1: Home ========== -->
<div id="homePage" class="page active">
<div class="tab-content">
<div class="brand-header">
<div class="brand-name">异 采</div>
<div class="brand-sub">化妆品行业可信供应链平台</div>
</div>
<div class="data-overview">
<div class="data-item"><div class="num">48</div><div class="label">认证供应商</div></div>
<div class="data-item"><div class="num">156</div><div class="label">生产过程记录</div></div>
<div class="data-item"><div class="num">92%</div><div class="label">好评率</div></div>
</div>
<div class="search-bar">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
<input type="text" id="searchInput" placeholder="搜索供应商名称、产品..." oninput="filterSuppliers()">
</div>
<div class="banner">
<div class="banner-text">✦ 生产过程可视化，采购更安心</div>
</div>
<div class="cat-tabs" id="catTabs">
<button class="cat-tab active" data-cat="all" onclick="switchCat(this)">全部</button>
<button class="cat-tab" data-cat="代工厂" onclick="switchCat(this)">代工厂</button>
<button class="cat-tab" data-cat="原料商" onclick="switchCat(this)">原料商</button>
<button class="cat-tab" data-cat="包材商" onclick="switchCat(this)">包材商</button>
<button class="cat-tab" data-cat="检测机构" onclick="switchCat(this)">检测机构</button>
</div>
<div class="supplier-list" id="supplierList"></div>
</div>
</div>

<!-- ========== Page 2: Orders ========== -->
<div id="ordersPage" class="page">
<div class="tab-content">

    return matchCat && matchKw;
  });

  if (!list.length) {
    el.innerHTML = '<div style="text-align:center;padding:40px;color:var(--sub);font-size:14px">暂无匹配的供应商</div>';

      <div class="tl-name">${p.n}</div>
      <div class="tl-time">${statusText}</div>
      ${p.s !== 'wait' ? `<div class="tl-desc">${p.d}</div>` : ''}
      ${p.p ? `<div class="tl-photo">${p.p} 查看照片</div>` : ''}
    </div>`;
  });
  html += `</div></div></div>`;

  // Products
  html += `<div class="section-title">📦 产品目录</div>`;
  s.products.forEach(p => {
    html += `<div class="product-card">
      <div class="product-img">${p.i}</div>
      <div class="product-info">
        <div class="product-name">${p.n}</div>
        <div class="product-spec">${p.s}</div>
        <div class="product-price">${p.p}</div>
        <div class="product-moq">${p.m}</div>
      </div>
    </div>`;
  });

  document.getElementById('detailBody').innerHTML = html;
  document.getElementById('detailPage').classList.add('show');
}

function closeDetail() {
  document.getElementById('detailPage').classList.remove('show');
}

// ===== Inquiry Modal =====
function openInquiry() {
  document.getElementById('inquiryModal').classList.add('show');
}
function closeInquiry() {
  document.getElementById('inquiryModal').classList.remove('show');
}
function submitInquiry() {
  closeInquiry();

// ===== Toast =====
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ===== Tab Switch =====
function switchTab(idx) {
  currentTab = idx;
  document.querySelectorAll('.page').forEach((p,i) => {
    p.classList.toggle('active', i === idx);
  });
  document.querySelectorAll('.tab-item').forEach((t,i) => {
    t.classList.toggle('active', i === idx);
  });
  if (idx === 1) renderOrders();
  if (idx === 2) renderInquiries();
}

// ===== Favorites =====
function renderFavorites() {
  const favIds = [1, 4];
  const favs = suppliers.filter(s => favIds.includes(s.id));
  let html = '';
  favs.forEach(s => {
    const initial = s.name.charAt(2);
    html += `<div class="fav-card" onclick="switchTab(0);setTimeout(()=>openDetail(${s.id}),100)">
      <div class="fav-avatar">${initial}</div>
      <div class="fav-info">
        <div class="fav-name">${s.name}</div>
        <div class="fav-type">${s.type} · ${s.location}</div>
      </div>
      <div class="fav-score">${s.score}分</div>
    </div>`;
  });
  document.getElementById('favContent').innerHTML = html;
}

// ===== Inquiries =====
function renderInquiries() {
  let html = '';
  inquiries.forEach((inq, i) => {
    const statusMap = {pending:['待回复','status-pending'],replied:['已回复','status-replied'],closed:['已关闭','status-closed']};
    const [label, cls] = statusMap[inq.status];
    html += `<div class="inquiry-card" onclick="toggleInquiry(${i})">
      <div class="inquiry-top">
        <div class="inquiry-supplier">${inq.supplier}</div>
        <div class="inquiry-status ${cls}">${label}</div>
      </div>
      <div class="inquiry-meta">
        <span>📦 ${inq.category}</span>
        <span>🕐 ${inq.time}</span>
      </div>
      <div class="inquiry-detail" id="inqDetail${i}">
        <div class="inquiry-detail-inner">
          <div class="inquiry-row"><span class="k">品类</span><span class="v">${inq.category}</span></div>
          <div class="inquiry-row"><span class="k">描述</span><span class="v">${inq.desc}</span></div>
          <div class="inquiry-row"><span class="k">数量</span><span class="v">${inq.qty}</span></div>
          ${inq.price ? `<div class="inquiry-row"><span class="k">期望价格</span><span class="v">${inq.price}</span></div>` : ''}
          ${inq.reply ? `<div class="inquiry-reply">💬 供应商回复：${inq.reply}</div>` : ''}
        </div>
      </div>
    </div>`;
  });
  document.getElementById('inquiryList').innerHTML = html;
}

function toggleInquiry(idx) {
  const el = document.getElementById('inqDetail' + idx);
  el.classList.toggle('open');
}

// ===== Close modal on overlay click =====
document.getElementById('inquiryModal').addEventListener('click', function(e) {
  if (e.target === this) closeInquiry();
});

function renderOrders() {
  let html = '';
  orders.forEach((o, i) => {
    const progressColor = o.status === 'shipped' ? '#2E7D32' : 'var(--orange)';
    html += `<div class="order-card" onclick="openOrderDetail(${i})">
      <div class="order-top">
        <div class="order-no">${o.id}</div>
        <div class="order-status ${o.status}">${o.statusText}</div>
      </div>
      <div class="order-supplier">${o.supplier}</div>
      <div class="order-product">${o.product} · ${o.qty}</div>
      <div class="order-progress">
        <div class="order-progress-bar"><div class="order-progress-fill" style="width:${o.progress}%;background:${progressColor}"></div></div>
        <div class="order-progress-text">${o.progress}%</div>
      </div>
      <div class="order-steps">`;
    o.steps.forEach(s => {
      const dotClass = s.active ? 'active' : s.done ? 'done' : '';
      const labelClass = s.active ? 'active' : '';
      html += `<div class="order-step"><div class="step-dot ${dotClass}"></div><div class="step-label ${labelClass}">${s.name}</div></div>`;
    });
    html += `</div></div>`;
  });
  document.getElementById('ordersList').innerHTML = html;
}

function openOrderDetail(idx) {
  const o = orders[idx];
  document.getElementById('odTitle').textContent = o.id;
  document.getElementById('odSub').textContent = o.product + ' · ' + o.qty;
  document.getElementById('odSupplier').textContent = o.supplier;
  
  // Progress bar
  const progressColor = o.status === 'shipped' ? '#2E7D32' : 'var(--orange)';
  let progressHtml = `<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
    <div style="flex:1;height:8px;background:var(--tag-bg);border-radius:4px;overflow:hidden">
      <div style="height:100%;width:${o.progress}%;background:${progressColor};border-radius:4px"></div>
    </div>
    <div style="font-size:14px;font-weight:600;color:${progressColor}">${o.progress}%</div>
  </div>
  <div style="font-size:12px;color:var(--sub)">当前工序：<span style="color:var(--text);font-weight:500">${o.currentStep}</span></div>`;
  document.getElementById('odProgress').innerHTML = progressHtml;
  
  // Timeline
  let tlHtml = '';
  o.timeline.forEach(t => {
    const dotClass = t.status === 'done' ? 'done' : t.status === 'active' ? 'active' : '';
    const timeText = t.status === 'wait' ? '<span style="color:#999">待进行</span>' : t.time;
    tlHtml += `<div class="ot-item">
      <div class="ot-dot ${dotClass}"></div>
      <div class="ot-name">${t.name}</div>
      <div class="ot-time">${timeText}</div>
      ${t.status !== 'wait' ? `<div class="ot-desc">${t.desc}</div>` : ''}
      ${t.photos.length ? `<div class="ot-photos">${t.photos.map(p => `<div class="ot-photo">${p}</div>`).join('')}</div>` : ''}
    </div>`;
  });
  document.getElementById('odTimeline').innerHTML = tlHtml;
  
  document.getElementById('orderDetailOverlay').classList.add('show');
}

function closeOrderDetail() {
  document.getElementById('orderDetailOverlay').classList.remove('show');
}
